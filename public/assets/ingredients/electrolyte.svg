<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="elecGrad" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#80e8ff"/>
      <stop offset="100%" stop-color="#1ec8ff"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="20" fill="url(#elecGrad)" filter="url(#glow)"/>
  <path d="M 100 50 L 95 100 L 110 100 L 95 150" stroke="#ffffff" stroke-width="4" fill="none" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="3" fill="#ffffff"/>
</svg>
